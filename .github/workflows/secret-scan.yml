name: Secret scan

# Scans the whole repository for committed secrets. The editor holds no
# credentials and needs none, so anything gitleaks reports here is a mistake
# rather than a deliberate exception.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # contents is read-only because the history scan needs nothing else.
    # security-events is only needed to publish SARIF, and that step is skipped
    # on pull requests, where a fork has no write access anyway.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          # gitleaks walks commits, so a shallow clone would only see the tip and
          # miss a secret that was introduced and removed earlier. That history
          # is exactly what this job exists to catch.
          fetch-depth: 0
          fetch-tags: true

      - name: Install gitleaks
        env:
          # Pinned so a run resolves the same scanner every time. Bump this and
          # the checksum together.
          VERSION: 8.30.1
          # From gitleaks_8.30.1_checksums.txt in the same release.
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan commit history
        # Catches a secret that was committed at any point, including one that
        # has since been deleted from the working tree.
        run: |
          gitleaks git . --redact --no-banner --verbose \
            --report-format sarif --report-path gitleaks.sarif

      - name: Scan the working tree
        # Covers files that exist on the merge commit but were never part of a
        # commit this scanner has walked yet.
        run: gitleaks dir . --redact --no-banner

      - name: Upload results to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks